name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deployment at a time. A queued deployment waits instead of cancelling a running one.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ matrix.environment }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # `dev` deploys first. A failure there cancels `production`.
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        environment: [dev, production]
    # Deploy only from main, including a manual run. Configure required reviewers on the `production` GitHub environment.
    if: github.ref == 'refs/heads/main'
    environment: ${{ matrix.environment }}
    env:
      ENVIRONMENT: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2

      # Secrets are set on the steps that use them. Install and build run without any.
      - run: pnpm install --frozen-lockfile

      # Checks both environments, so a production placeholder stops the run before dev deploys.
      - name: Refuse placeholder settings
        run: pnpm exec tsx tools/placeholders.ts dev production

      # `supabase config push` applies only the [remotes.*] block whose project_id matches
      # the target project. Without a match it would push the local localhost Auth URLs.
      - name: Confirm config.toml describes this environment's project
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          block=$(awk -v header="[remotes.${ENVIRONMENT}]" '$0 == header { inside = 1; next } /^\[/ { inside = 0 } inside' supabase/config.toml)
          if ! grep -qxF "project_id = \"${SUPABASE_PROJECT_REF}\"" <<< "$block"; then
            echo "::error::supabase/config.toml has no [remotes.${ENVIRONMENT}] block with this environment's project reference. Set its project_id."
            exit 1
          fi

      - name: Link the Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: pnpm exec supabase link --project-ref "$SUPABASE_PROJECT_REF"

      # Migrations go first: the Auth config enables a hook that calls a migrated function.
      - name: Apply migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: pnpm exec supabase db push

      - name: Apply Auth configuration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ${{ secrets.SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID }}
          SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ${{ secrets.SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET }}
        run: pnpm exec supabase config push --yes

      # CLOUDFLARE_ENV makes the Vite plugin write this environment's name, bindings, and
      # vars into dist/server/wrangler.json, which `wrangler deploy` then reads.
      - name: Build the Worker
        run: pnpm build
        env:
          CLOUDFLARE_ENV: ${{ matrix.environment }}

      - name: Deploy the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          secrets_file="$RUNNER_TEMP/worker-secrets.json"
          umask 077
          jq -n --arg supabase "$SUPABASE_SECRET_KEY" --arg llm "$LLM_API_KEY" \
            '{ SUPABASE_SECRET_KEY: $supabase, LLM_API_KEY: $llm }' > "$secrets_file"
          pnpm exec wrangler deploy --secrets-file "$secrets_file"
          rm -f "$secrets_file"

      - name: Verify the deployment
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: pnpm verify:deployed --env "$ENVIRONMENT"

      - name: Report an unverified deployment
        if: failure()
        run: |
          {
            echo "### ${ENVIRONMENT}: unverified"
            echo "A step failed or did not run. Treat this deployment as unverified until \`pnpm verify:deployed --env ${ENVIRONMENT}\` passes."
          } >> "$GITHUB_STEP_SUMMARY"
