name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # `supabase start` resolves env() in config.toml. No CI test contacts Google.
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: local-test-client
      SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: local-test-secret
    steps:
      # Full history so check:repo can compare migrations with origin/<base branch>.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2

      - run: pnpm install --frozen-lockfile

      - name: Start the local Supabase stack
        run: pnpm exec supabase start --exclude studio,imgproxy,realtime,storage-api,edge-runtime,logflare,vector,supavisor,mailpit

      # pnpm check starts the provider double itself and resets the database first.
      - run: pnpm check

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            test-results/
          if-no-files-found: ignore
          retention-days: 7
